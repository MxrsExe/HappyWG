<!DOCTYPE html>
<html lang="de">

<!---Diese base.html (ohne Flash Messages) wurde mit von ChatGPT erstellt. 
Prompt: "https://bootswatch.com/zephyr/ kannst du mir eine base.html aus diesem bootstrap theme erstellen"-->

<head>
    <meta charset="UTF-8">
    <title>{% block title %}HappyWG{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/zephyr/bootstrap.min.css">
    
</head>
<body class="bg-light">


<div class="container">

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show mt-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
